<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tops deportivos | TO’ SE VENDE</title>
    <meta name="description" content="Tops deportivos. Consulta colores, talla y disponibilidad en TO’ SE VENDE.">

    <link rel="stylesheet" href="../css/productos.css">
    <link rel="stylesheet" href="../css/icono-carrito.css">
</head>

<body class="product-detail-page">

    <!-- CABECERA -->
    <header class="detail-header">
        <div class="detail-container detail-header-inner">

            <a class="detail-brand" href="../index.html">
                <img src="../img/logo.jpeg" alt="Logo de TO’ SE VENDE">
                <span>TO’ SE VENDE</span>
            </a>

            <a class="detail-back" href="../categorias/gimnasio.html">
                ← Volver a gimnasio
            </a>

        </div>
    </header>


    <main class="detail-container">

        <section class="product-detail">

            <!-- FOTO DEL PRODUCTO -->
            <div class="detail-gallery">
                <img
                    src="../img/tops.jpg"
                    alt="Tops deportivos en diferentes colores"
                    class="detail-main-image"
                >
            </div>


            <!-- INFORMACIÓN DEL PRODUCTO -->
            <div class="detail-info">

                <p class="detail-eyebrow">ROPA DEPORTIVA</p>

                <h1>Tops deportivos</h1>

                <p class="detail-price">5 USD</p>

                <!-- COLORES -->
                <div class="detail-option">
                    <h2>Colores disponibles</h2>

                    <p class="selected-color">
                        Selecciona un color para consultar
                    </p>

                    <div class="color-options">

                        <button
                            type="button"
                            class="color-circle color-beige"
                            data-color="Beige"
                            aria-label="Beige"
                            title="Beige"
                        ></button>
                      
                        <button
                            type="button"
                            class="color-circle color-blanco"
                            data-color="Blanco"
                            aria-label="Blanco"
                            title="Blanco"
                        ></button>

                        <button
                            type="button"
                            class="color-circle color-carmelita"
                            data-color="Carmelita"
                            aria-label="Carmelita"
                            title="Carmelita"
                        ></button>

                        <button
                            type="button"
                            class="color-circle color-burdeos"
                            data-color="Rojo Burdeos"
                            aria-label="Rojo Burdeos"
                            title="Rojo Burdeos"
                        ></button>

                        <button
                            type="button"
                            class="color-circle color-negro"
                            data-color="Negro"
                            aria-label="Negro"
                            title="Negro"
                        ></button>

                    </div>
                </div>


                <!-- TALLA -->
                <div class="detail-option">
                    <h2>Talla disponible</h2>

                    <div class="size-options">
                        <span class="size-selected">S</span>
                    </div>
                </div>

                <button
                    type="button"
                    class="detail-whatsapp detail-add-cart"
                    id="add-product-to-cart"
                    data-product-id="tops"
                    disabled
                >
                    Añadir al carrito
                </button>

            </div>

        </section>

    </main>

    <!-- PIE DE PÁGINA -->
        <footer class="gym-footer">
            <div class="gym-container">
                <p><strong>TO’ SE VENDE</strong></p>
                <p>Tu próxima compra puede estar aquí.</p>
                <p><a href="../index.html">Volver a la página principal</a></p>
                <p>© 2026 TO’ SE VENDE</p>
            </div>
        </footer>

    <script>
        window.disponibilidadColores = {
            "Beige": true,
            "Blanco": false,
            "Carmelita": true,
            "Rojo Burdeos": false,
            "Negro": true
        };
    </script>

    <script src="../js/carrito.js"></script>
    <script src="../js/cabecera-carrito.js"></script>
    <script src="../js/variantes-productos.js"></script>
    

</body>
</html>
