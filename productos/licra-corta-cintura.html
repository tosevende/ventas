<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Licras cortas deportivas | TO’ SE VENDE</title>
    <meta name="description" content="Licras cortas deportivas cintura alta. Consulta colores, talla y disponibilidad en TO’ SE VENDE.">

    <link rel="stylesheet" href="../css/productos.css">
    <link rel="stylesheet" href="../css/icono-carrito.css">
</head>

<body class="product-detail-page">

    <!-- CABECERA -->
    <header class="detail-header">
        <div class="detail-container detail-header-inner">

            <a class="detail-brand" href="../index.html">
                <img src="../img/logo.jpeg" alt="Logo de TO’ SE VENDE">
                <span>TO’ SE VENDE</span>
            </a>

            <a class="detail-back" href="../categorias/gimnasio.html">
                ← Volver a gimnasio
            </a>

        </div>
    </header>


    <main class="detail-container">

        <section class="product-detail">

            <!-- FOTO DEL PRODUCTO -->
            <div class="detail-gallery">
                <img
                    src="../img/licras-cortas.jpg"
                    alt="Licras cortas deportivas cintura alta en diferentes colores"
                    class="detail-main-image"
                >
            </div>


            <!-- INFORMACIÓN DEL PRODUCTO -->
            <div class="detail-info">

                <p class="detail-eyebrow">ROPA DEPORTIVA</p>

                <h1>Licras cortas deportivas cintura alta</h1>

                <p class="detail-price">9 USD</p>

                <!-- COLORES -->
                <div class="detail-option">
                    <h2>Colores disponibles</h2>

                    <p class="selected-color">
                        Selecciona un color para consultar
                    </p>

                    <div class="color-options">

                        <button
                            type="button"
                            class="color-circle color-rosa"
                            data-color="Rosa"
                            aria-label="Rosa"
                            title="Rosa"
                        ></button>

                        <button
                            type="button"
                            class="color-circle color-verde-azulado"
                            data-color="Verde Azulado"
                            aria-label="Verde Azulado"
                            title="Verde Azulado"
                        ></button>

                        <button
                            type="button"
                            class="color-circle color-azul-grisáceo"
                            data-color="Azul Grisáceo"
                            aria-label="Azul Grisáceo"
                            title="Azul Grisáceo"
                        ></button>

                        <button
                            type="button"
                            class="color-circle color-gris-oscuro"
                            data-color="Gris Oscuro"
                            aria-label="Gris Oscuro"
                            title="Gris Oscuro"
                        ></button>

                        <button
                            type="button"
                            class="color-circle color-negro"
                            data-color="Negro"
                            aria-label="Negro"
                            title="Negro"
                        ></button>

                    </div>
                </div>


                <!-- TALLA -->
                <div class="detail-option">
                    <h2>Talla disponible</h2>

                    <div class="size-options">
                        <span class="size-selected">M</span>
                    </div>
                </div>


                <!-- Añadir al carrito -->
               <button
                    type="button"
                    class="detail-whatsapp detail-add-cart"
                    id="add-product-to-cart"
                    data-product-id="licras-cortas"
                    disabled
                >
                    Añadir al carrito
                </button>

            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="gym-footer">
        <div class="gym-container">
            <p><strong>TO’ SE VENDE</strong></p>
            <p>Tu próxima compra puede estar aquí.</p>
            <p><a href="../index.html">Volver a la página principal</a></p>
            <p>© 2026 TO’ SE VENDE</p>
        </div>
    </footer>


    <!-- SELECCIÓN DE COLOR Y AGREGAR AL CARRITO -->
    <script>
        window.disponibilidadColores = {
            "Rosa": false,
            "Verde Azulado": true,
            "Azul Grisáceo": false,
            "Gris Oscuro": false,
            "Negro": false
        };
    </script>
    
    <script src="../js/carrito.js"></script>
    <script src="../js/cabecera-carrito.js"></script>
    <script src="../js/variantes-productos.js"></script>

</body>
</html>
